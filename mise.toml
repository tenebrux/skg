[settings]
experimental = true

[tools]
zig = "0.15.2"
go = "1.26.8"
rust = "1.98.1"
node = "24.21.0"
pkl = "0.32.1"
hk = "1.58.1"
shellcheck = "0.11.0"
goreleaser = "2.18.1"
"npm:@fission-ai/openspec" = "1.13.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "1.7.12"

[env]
HK_MISE = "1"

[hooks]
postinstall = """
  hk install --mise || true
  if [ ! -d openspec ]; then
    openspec init --tools claude
  else
    openspec update
  fi
  # Pre-stage so `mise install` leaves a build-ready tree.
  zig build --fetch >/dev/null 2>&1 || true
  (cd go && go mod download) || true
"""

[tasks.test]
run = "zig build test && cd go && go test -race -v ./..."
depends = ["test:rust", "test:consumers"]
description = "Run all parser tests (Zig + Go + Rust)"

[tasks."test:consumers"]
run = """
cd testdata/consumers/go && go vet ./... && go test -race ./...
cd ../zig && zig build test && zig build test -Doptimize=ReleaseSafe
cd ../rust && cargo clippy --all-targets -- -D warnings && cargo test
"""
description = "Run standalone Go, Zig and Rust application-boundary tests"

[tasks."test:zig"]
run = "zig build test"
description = "Run Zig parser tests"

# -v is deliberate: `go test` throws away a passing package's output, and the
# conformance suite ends with an unconditional summary of the fixtures it
# skipped for capabilities go/conformance.json does not declare. Without -v
# that line never reaches the terminal.
[tasks."test:go"]
run = "cd go && go test -race -v ./..."
description = "Run Go parser tests"

# The Rust conformance, native, resolution and differential suites all run
# under `cargo test`; release mode re-runs them with optimizations on.
[tasks."test:rust"]
# mise's rust plugin installs the minimal rustup profile, so make sure the
# rustfmt and clippy components exist before the gate uses them.
run = """
rustup component add rustfmt clippy
cd rust
cargo fmt --check
cargo clippy --all-targets -- -D warnings
cargo test -- --nocapture
cargo test --release
"""
description = "Format, lint and test the Rust parser"

[tasks."v1:differential"]
run = "zig build && cd go && go run ../tools/differential.go"
description = "Require Go and Zig to canonicalize 1,000 generated V1 sources identically"

# Mirrors the tree-sitter job in .github/workflows/ci.yml, including the drift
# check: check:fixtures regenerates src/ before parsing, so a committed
# parser.c built from an older grammar.js shows up as a dirty tree. Neovim and
# Helix consume the committed file, not grammar.js.
[tasks."test:tree-sitter"]
run = """
cd tools/tree-sitter-skg
npm install
npm run check:fixtures
git diff --exit-code -- src/
"""
description = "Parse every valid fixture with the tree-sitter grammar, and check src/ is not stale"

[tasks."test:vscode"]
run = "cd tools/vscode-skg && npm ci --ignore-scripts && npm test"
description = "Tokenize every valid fixture and V1 syntax probe with the VS Code grammar"

# Mirrors the checks in .github/workflows/ci.yml so `mise run ci` matches the gate.
[tasks.lint]
run = """
zig fmt --check zig/
cd go && go vet ./...
cd rust && cargo fmt --check && cargo clippy --all-targets -- -D warnings
"""
description = "Check Zig formatting and vet the Go and Rust parsers"

[tasks.fmt]
run = "zig fmt zig/"
description = "Format all source files in place"

[tasks.clean]
run = "rm -rf zig-out zig-cache .zig-cache"
description = "Remove build artifacts"

[tasks.check]
depends = ["lint", "test"]
description = "Full check - lint + tests"

[tasks."plugins:tree-sitter:generate"]
run = "cd tools/tree-sitter-skg && npm install && npx tree-sitter generate --abi 14"
description = "Regenerate the tree-sitter parser from grammar.js"

[tasks."plugins:tree-sitter:build"]
depends = ["plugins:tree-sitter:generate"]
run = "cd tools/tree-sitter-skg && npx tree-sitter build"
description = "Build the native tree-sitter parser shared library"

[tasks."plugins:tree-sitter:wasm"]
depends = ["plugins:tree-sitter:generate"]
run = "cd tools/tree-sitter-skg && npx tree-sitter build --wasm"
description = "Build the WASM tree-sitter parser (for Zed, web editors)"

# The .vsix is a build artifact and is gitignored. Released copies are built by
# the vscode job in .github/workflows/release.yml and attached to the release,
# so the published extension always matches the tag.
[tasks."plugins:vscode:package"]
run = "cd tools/vscode-skg && npm ci && npx --no-install vsce package --out skg.vsix"
description = "Package the VS Code extension as tools/vscode-skg/skg.vsix (gitignored)"

[tasks."plugins:vscode:install"]
depends = ["plugins:vscode:package"]
run = "code --install-extension tools/vscode-skg/skg.vsix"
description = "Build and install the VS Code extension into the local VS Code"

[tasks."plugins:build"]
depends = ["plugins:tree-sitter:build", "plugins:vscode:package"]
description = "Build all editor plugins (tree-sitter native + vscode vsix)"

[tasks.build]
description = "Build all parser implementations (Zig + Go + Rust)"
run = """
zig build
cd go && go build ./...
cd rust && cargo build --all-targets
"""

[tasks.format]
depends = ["fmt"]
description = "Format all source (alias for `fmt`)"

[tasks.update]
description = "Update Zig + Go dependencies"
run = """
zig build --fetch
cd go && go get -u ./... && go mod tidy
"""

[tasks.install]
description = "Not applicable — skg is a parser library; consume from build.zig.zon, go.mod or crates"
run = """
echo "skg: 'install' is not applicable — this is a parser library set."
echo "Depend on the Zig parser via build.zig.zon, the Go parser via go.mod,"
echo "or the Rust package from your Cargo.toml."
"""

[tasks.start]
description = "No daemon to start; runs the full test suite instead"
depends = ["test"]

[tasks.security]
description = "Scan the Go parser for known vulnerabilities (govulncheck)"
run = "cd go && govulncheck ./..."

[tasks.ci]
description = "Run the full CI check locally (lint + test + tree-sitter + security)"
depends = ["lint", "test", "test:tree-sitter", "security"]

[tasks."v1:check"]
description = "Run the complete V1 compatibility and release gate"
run = "bash tools/v1-check.sh"
