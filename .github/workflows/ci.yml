name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  v1:
    name: V1 release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"
      - name: Run the authoritative V1 gate
        env:
          SKG_VSIX_OUT: ${{ github.workspace }}/dist/skg-vscode-dev.vsix
        run: mise run v1:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error

  # go.mod names 1.26 as the minimum. The release gate runs that exact line;
  # this small adjunct catches problems on the current supported Go release.
  go-current:
    name: Go 1.27 compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - run: go test ./...
      - name: Go consumer project
        working-directory: testdata/consumers/go
        run: go test ./...

  runtime-platforms:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Zig 0.15.2 cannot link on the macOS 26 image currently selected by
        # macos-latest. V1 supports the pinned compiler, so run it on the
        # supported macOS 15 image rather than silently dropping macOS runtime
        # coverage.
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"
      - name: Zig runtime suite
        run: zig build test -Doptimize=ReleaseSafe
      - name: Go runtime suite
        working-directory: go
        run: go test ./...
      - name: Zig consumer project
        working-directory: testdata/consumers/zig
        run: zig build test -Doptimize=ReleaseSafe
      - name: Go consumer project
        working-directory: testdata/consumers/go
        run: go test ./...
