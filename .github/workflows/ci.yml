name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  v1:
    name: V1 release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"
      - name: Run the authoritative V1 gate
        env:
          SKG_VSIX_OUT: ${{ github.workspace }}/dist/skg-vscode-dev.vsix
        run: mise run v1:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error

  # go.mod names 1.26 as the minimum. The release gate runs that exact line;
  # this small adjunct catches problems on the current supported Go release.
  go-current:
    name: Go 1.27 compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - run: go test ./...

  runtime-platforms:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"
      - name: Zig runtime suite
        run: zig build test -Doptimize=ReleaseSafe
      - name: Go runtime suite
        working-directory: go
        run: go test ./...
