name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    uses: tenebrux/github-workflows/.github/workflows/zig-ci.yml@master
    with:
      zig-fmt-paths: "zig/"

  go:
    name: Go parser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # No go.sum (the parser has no dependencies) - nothing to cache.
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Runs the shared testdata/ conformance suite against the Go parser, so a
      # fixture that only the Go side sees still gates the merge.
      #
      # -v is deliberate: `go test` discards a passing package's output, and the
      # conformance suite ends with an unconditional summary of the fixtures it
      # skipped for undeclared capabilities (see go/conformance.json). Without
      # -v that line would never reach the log, which is exactly the silent
      # partial conformance the harness exists to prevent.
      - name: Test
        run: go test -race -v ./...

  tree-sitter:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tree-sitter-skg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install
        run: npm ci
      # Regenerates src/parser.c from grammar.js, then parses every
      # testdata/valid/**/*.skg and fails on any ERROR or MISSING node.
      # This is a highlighting grammar, not a conformance peer - there is
      # deliberately no AST comparison against the Go or Zig parsers.
      - name: Parse every valid fixture
        run: npm run check:fixtures
      # check:fixtures regenerates src/ before parsing, so by this point the
      # working tree holds a parser.c built from the current grammar.js. If it
      # differs from the committed one, the committed one is stale - and Neovim
      # and Helix consume the committed file, not the grammar, so they would be
      # running a parser nobody reviewed.
      - name: Committed parser.c matches grammar.js
        run: git diff --exit-code -- src/

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vscode-skg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # A malformed TextMate grammar does not fail loudly - VS Code drops the
      # grammar and the file renders as plain text, so nothing here was checked
      # by anything until now.
      - name: Grammar and manifest are valid JSON
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("syntaxes/skg.tmLanguage.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("language-configuration.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("package.json","utf8"))'
      - name: Install
        run: npm ci
      # Packaging is the only check that the manifest, the grammar paths and the
      # declared files actually hang together. The artifact is uploaded so a
      # reviewer can install the extension from a PR without building it, and
      # so the packaging path is exercised on every commit rather than only at
      # release time.
      - name: Package
        run: |
          mkdir -p ../../dist
          npx --yes @vscode/vsce package --out ../../dist/skg-vscode-dev.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error
