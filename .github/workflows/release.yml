name: Release

# Fires on vX.Y.Z and vX.Y.Z-rc.N tags. Two equally supported paths:
#   1. The Cut Release workflow (computes the version, stamps the tree,
#      pushes vX.Y.Z + go/vX.Y.Z, then explicitly dispatches this workflow).
#   2. Direct tagging: `git tag -a vX.Y.Z && git push origin vX.Y.Z`.
#      The publish job creates the go/vX.Y.Z companion tag automatically
#      if it's missing, so Go module resolution works either way. A tag
#      that doesn't match build.zig.zon's version is rejected.
#
# The go/vX.Y.Z companion tags do not match "v*" (glob * does not cross /),
# so they never re-trigger this workflow.
#
# RC tags publish as prereleases and never move the "latest" pointer.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Gate (full suite)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"
      - name: Run the authoritative V1 gate
        env:
          SKG_RELEASE_TAG: ${{ github.ref_name }}
        run: mise run v1:check

  build:
    name: Build ${{ matrix.target }}
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="skg-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          case "${{ matrix.target }}" in
            *windows*) cp zig-out/bin/skg.exe "dist/$name/" ;;
            *)         cp zig-out/bin/skg "dist/$name/" ;;
          esac
          cp LICENSE README.md "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) zip -qr "$name.zip" "$name"; sha256sum "$name.zip" > "$name.zip.sha256" ;;
            *)         tar czf "$name.tar.gz" "$name"; sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The VS Code extension is a release asset, not a committed artifact. A
  # skg.vsix used to live in the tree; it went stale the first time anyone
  # touched the grammar and shipped a grammar four months older than the
  # source for the rest of its life. Building it here means the published
  # .vsix always matches the tag it ships with.
  vscode:
    name: Package VS Code extension
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vscode-skg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install locked packaging tools
        run: npm ci
      - name: Package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # vsce only accepts MAJOR.MINOR.PATCH, so an RC packages under its
          # base version; the filename still carries the full tag.
          version="${tag%%-*}"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$version"
          mkdir -p ../../dist
          npx --no-install vsce package --out "../../dist/skg-vscode-${tag}.vsix"
          cd ../../dist
          sha256sum "skg-vscode-${tag}.vsix" > "skg-vscode-${tag}.vsix.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-vscode
          path: |
            dist/*.vsix
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, vscode]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Direct tagging support: Go can only fetch the go/ subdirectory
      # module at a version tagged go/vX.Y.Z. Cut Release pushes that tag
      # itself; for a hand-pushed vX.Y.Z, create it here.
      - name: Ensure go/ companion tag
        run: |
          companion="go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$companion" >/dev/null; then
            commit=$(git ls-remote --tags origin "refs/tags/$companion^{}" | awk 'NR == 1 { print $1 }')
            if [ -z "$commit" ]; then
              commit=$(git ls-remote --tags origin "refs/tags/$companion" | awk 'NR == 1 { print $1 }')
            fi
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "::error::$companion points to $commit, expected $GITHUB_SHA"
              exit 1
            fi
            echo "$companion already exists at the release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$companion" -m "skg Go parser ${GITHUB_REF_NAME}" "$GITHUB_SHA"
            git push origin "$companion"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger naur repo update
        if: success()
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::NAUR_DISPATCH_TOKEN is not configured; skipping naur update"
            exit 0
          fi
          gh api /repos/FynxLabs/naur/dispatches -f event_type=release
        env:
          GH_TOKEN: ${{ secrets.NAUR_DISPATCH_TOKEN }}
