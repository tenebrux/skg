name: Cut Release

# The release button. Pick a level, and this workflow computes the next
# version from existing tags, gates on the full test suite, stamps the
# version into the tree, pushes the tags, then dispatches release.yml.
#
#   major / minor / patch      straight stable release
#   rc-major / rc-minor / rc-patch
#                              open an RC series for the next X / X.Y / X.Y.Z
#   rc-next                    cut the next rc.N in the open series
#   rc-promote                 ship the version the RC series was testing
#
# Two tags are pushed per release: vX.Y.Z for the repo (release.yml,
# Zig consumers) and go/vX.Y.Z so the Go module in go/ is fetchable at
# that version (Go requires subdirectory modules to be tagged with the
# directory prefix).

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Release level"
        required: true
        type: choice
        options:
          - rc-major
          - rc-minor
          - rc-patch
          - rc-next
          - rc-promote
          - major
          - minor
          - patch

permissions:
  contents: write
  actions: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut ${{ inputs.level }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.4.10"

      - name: Compute next version
        id: version
        run: |
          version=$(.github/scripts/next-version.sh "${{ inputs.level }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cutting v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the prospective release version
        run: node tools/check-release.mjs --version "${{ steps.version.outputs.version }}"

      - name: Test gate
        run: mise run v1:check

      - name: Stamp version
        run: |
          version="${{ steps.version.outputs.version }}"
          sed -i -E 's/(\.version = ")[^"]+(")/\1'"$version"'\2/' build.zig.zon
          grep -qF "\"$version\"" build.zig.zon

          # VS Code Marketplace and npm reject or mishandle -rc.N versions,
          # so the editor-tool manifests only track stable releases.
          case "$version" in
            *-rc.*) ;;
            *)
              for pkg in tools/vscode-skg/package.json tools/tree-sitter-skg/package.json; do
                node -e '
                  const fs = require("fs"), p = process.argv[1];
                  const j = JSON.parse(fs.readFileSync(p, "utf8"));
                  j.version = process.argv[2];
                  fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
                  const lockPath = p.replace(/package.json$/, "package-lock.json");
                  const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
                  lock.version = j.version;
                  if (lock.packages?.[""]) lock.packages[""].version = j.version;
                  fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + "\n");
                ' "$pkg" "$version"
              done
              ;;
          esac

          node tools/check-release.mjs --tag "v$version"

      - name: Commit and tag
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.zig.zon tools/vscode-skg/package*.json tools/tree-sitter-skg/package*.json
          git commit -m "release: v$version"
          git tag -a "v$version" -m "skg v$version"
          git tag -a "go/v$version" -m "skg Go parser v$version"
          git push --atomic origin HEAD:master "v$version" "go/v$version"

      # A push made with GITHUB_TOKEN cannot trigger another push workflow.
      # workflow_dispatch is supported with that token, so no PAT is needed.
      - name: Start release build for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "v$RELEASE_VERSION"
