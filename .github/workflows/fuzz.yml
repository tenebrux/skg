name: Fuzz

permissions:
  contents: read

# The targets cover parser totality and canonical output, native conversion,
# overlay composition, and bounded import-graph resolution. Without -fuzz,
# `go test` runs only their seed corpora, so ordinary CI proves nothing about
# inputs nobody thought of.
#
# This runs the fuzzer proper on a schedule instead of on every push: it is a
# time-boxed search, not a pass/fail gate a contributor can act on in a PR.
# A crasher is written to testdata/fuzz/ by the fuzzer and uploaded here, so it
# can be committed as a seed and turned into a regression test.
on:
  schedule:
    # 04:17 Mondays. Off the hour so it does not queue behind everything else
    # scheduled at :00.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to fuzz (Go duration, e.g. 30m)"
        required: false
        default: "20m"

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzNativeDecode, FuzzMergeComposition, FuzzResolveBudgets]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Fuzz
        env:
          FUZZ_DURATION: ${{ inputs.duration || '20m' }}
        run: go test -run '^$' -fuzz="^${{ matrix.target }}$" -fuzztime="$FUZZ_DURATION" ./...
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: go/testdata/fuzz/
          if-no-files-found: ignore
